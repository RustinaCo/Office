[package]
name = "wordcraft-android"
version = "0.7.0"
edition = "2024"
description = "WordCraft on Android (same engine + egui UI, Android backend)"
license = "MIT OR Apache-2.0"

[lib]
name = "wordcraft_android"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wordcraft-android-desktop"
path = "src/main.rs"

[dependencies]
# Same engine + UI crates as the desktop app, by path (upstream clone untouched).
wordcraft-engine = { path = "../wordcraft/crates/engine" }
wordcraft-ui-egui = { path = "../wordcraft/crates/ui-egui" }
# Pinned to the exact versions the upstream workspace uses (see wordcraft/Cargo.lock).
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = "=0.36.2"
winit = "=0.30.13"
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
# System-bar insets over JNI (pinned to android-activity's own jni).
jni = "=0.22.4"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.android]
package = "net.craftsuite.wordcraft"
build_targets = ["aarch64-linux-android"]
java_sources = "android/java"
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "Rustina Write"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|layoutDirection"
window_soft_input_mode = "adjustResize"
label = "Rustina Write"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "wordcraft_android"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# Inbound shares: file manager / browser › Share › Word opens the file.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/vnd.openxmlformats-officedocument.wordprocessingml.document"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "text/plain"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/pdf"

# Transparent helper that runs the system file picker (SAF) and stashes the
# result for the Rust side to poll (a NativeActivity gets no activity result).
[[package.metadata.android.application.activity]]
name = ".FilePickerActivity"
exported = false
