name: Release Android APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ARM64 APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Install NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" || true
          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -type d | tail -n 1)
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Install cargo-apk
        run: |
          cargo install cargo-apk

      - name: Build Rustina Tables APK
        run: |
          cd Tables/grid-android
          cargo apk build --release --lib
          mkdir -p ../../dist
          cp $(find target -name "*.apk" -type f | head -n 1) ../../dist/RustinaTables-${{ github.ref_name }}.apk

      - name: Build Rustina Write APK
        run: |
          cd Write/word-android
          cargo apk build --release --lib
          mkdir -p ../../dist
          cp $(find target -name "*.apk" -type f | head -n 1) ../../dist/RustinaWrite-${{ github.ref_name }}.apk

      - name: Build Rustina Slides APK
        run: |
          cd Slides/deck-android
          cargo apk build --release --lib
          mkdir -p ../../dist
          cp $(find target -name "*.apk" -type f | head -n 1) ../../dist/RustinaSlides-${{ github.ref_name }}.apk

      - name: Verify Built APKs
        run: |
          ls -lh dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Rustina Office ${{ github.ref_name }}
          body_path: README.md
          draft: false
          prerelease: false
          files: |
            dist/RustinaTables-*.apk
            dist/RustinaWrite-*.apk
            dist/RustinaSlides-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
