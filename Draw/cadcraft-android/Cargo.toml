[package]
name = "cadcraft-android"
version = "0.9.0"
edition = "2024"
description = "CADCraft on Android (Rustina Draw)"
license = "MIT OR Apache-2.0"

[lib]
name = "cadcraft_android"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cadcraft-android-desktop"
path = "src/main.rs"

[dependencies]
# Same engine, I/O and UI crates as the desktop app, by path (the upstream clone is untouched).
cadcraft-engine = { path = "../cadcraft/crates/engine" }
# `install_io` registers cadcraft_io's readers/writers into the engine (see `src/lib.rs`).
cadcraft-io = { path = "../cadcraft/crates/io" }
cadcraft-ui-egui = { path = "../cadcraft/crates/ui-egui" }
# Pinned to the exact versions the upstream workspace uses (see cadcraft/Cargo.lock).
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = "=0.36.2"
winit = "=0.30.13"
log = "0.4"
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
# System-bar insets, the IME overlay, the clipboard and SAF over JNI (android-activity's own jni).
jni = "=0.22.4"

# No `panic = "abort"`: the engine's never-crash guard is `catch_unwind` (crates/engine/src/guard.rs),
# which an aborting profile would turn into a killed process.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[package.metadata.android]
package = "net.craftsuite.cadcraft"
build_targets = ["aarch64-linux-android"]
java_sources = "android/java"
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
icon = "@mipmap/ic_launcher"
label = "Rustina Draw"
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|density|layoutDirection"
window_soft_input_mode = "adjustResize"
label = "Rustina Draw"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "cadcraft_android"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# Inbound shares: file manager / browser › Share › Rustina Draw opens the drawing.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]

# The public drawing types, plus `application/octet-stream` — Android's MimeTypeMap has no entry
# for .dxf or .dwg, so a file manager offers the binary default — and `text/plain`, which an
# ASCII DXF arrives as from providers that sniff text (OPEN reports what it cannot read).
[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/vnd.dxf"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/dxf"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/dwg"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "image/vnd.dwg"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/acad"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "application/octet-stream"

[[package.metadata.android.application.activity.intent_filter.data]]
mime_type = "text/plain"

# Transparent helper that runs the system file picker (SAF) and stashes the
# result for the Rust side to poll (a NativeActivity gets no activity result).
[[package.metadata.android.application.activity]]
name = ".FilePickerActivity"
exported = false
